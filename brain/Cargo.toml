[package]
edition      = "2024"
name         = "brain"
rust-version = "1.96"
version      = "0.1.0"

[build-dependencies]
cortex-build = { path = "../cortex-build" }

[dependencies]
ball-dmx = { path = "../ball-dmx" }
cortex   = { path = "../cortex" }
# The face, the cabinet door's buttons: rppal for the GPIO, libc only because std cannot turn
# the time into a local wall-clock time for the trace lines.
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-std"] }
embassy-time     = { version = "0.5.0",  features = ["std"] }
libc             = "0.2.189"
rig-mqtt         = { path = "../rig-mqtt" }
rppal            = "0.22.1"
