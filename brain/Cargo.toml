[package]
edition      = "2024"
name         = "brain"
rust-version = "1.99"
version      = "0.1.0"

[build-dependencies]
cortex-build = { path = "../cortex-build" }

[dependencies]
ball-dmx = { path = "../ball-dmx" }
cortex   = { path = "../cortex" }
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-std"] }
embassy-time     = { version = "0.5.0",  features = ["std"] }
rig-mqtt         = { path = "../rig-mqtt" }
# The face, the cabinet door's buttons and lamps.
rppal            = "0.22.1"
