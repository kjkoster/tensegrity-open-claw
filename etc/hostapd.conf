# The WiFi access point that the wireless fixtures join.
#
# This copy is the source of truth: it is installed on every deploy, so anything retuned on
# the access point itself and not carried back here is overwritten. The SSID and passphrase
# are compiled into the fixtures' firmware, whose build reads them from this file, so
# changing either means re-flashing them.
country_code=NL
interface=wlan0
ssid=closed claw DMX
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=close-that-claw

# Forget a station that has been silent this many seconds (the default is 300).
#
# A fixture that restarts without saying goodbye -- a reflash, a reset, a battery swap -- is
# still listed here as associated, and for as long as it is, the WiFi chip does not answer
# its attempts to join again. Dropping it quickly is what lets it back in. The fixture does
# its half by staying silent for longer than this between attempts: its firmware's build
# reads this value and adds a margin.
ap_max_inactivity=10
