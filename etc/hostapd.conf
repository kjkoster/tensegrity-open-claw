# The WiFi access point that the wireless fixtures join.
#
# This copy is the source of truth: it is installed on every deploy, so anything retuned on
# the access point itself and not carried back here is overwritten. The BSSID, SSID, channel
# and passphrase are compiled into the fixtures' firmware, whose build reads them from this
# file, so changing any of them means re-flashing them.
country_code=NL
interface=wlan0
# The access point's own MAC — the Pi's wlan0 — written down so the fixtures' firmware can
# join it directly instead of looking for it by name: their build reads it from here. Read it
# off the Pi with `cat /sys/class/net/wlan0/address`; a different Pi means a new value here and
# re-flashed fixtures.
bssid=b8:27:eb:46:e4:b7
ssid=closed claw DMX
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=close-that-claw

# Forget a station that has been silent this many seconds (the default is 300).
#
# A fixture that restarts without saying goodbye -- a reflash, a reset, a battery swap -- is
# still listed here as associated, and for as long as it is, the WiFi chip does not answer
# its attempts to join again. Dropping it quickly is what lets it back in. The fixture does
# its half by staying silent between attempts for twice this — even an ignored attempt counts
# as activity — and its firmware's build reads this value to do so. A connected fixture pings
# the broker more often than this, so a live one is never taken for silent.
ap_max_inactivity=6

# Drop a silent station at once, instead of first sending it a test frame and waiting about
# three seconds for an answer. The fixtures ping well inside ap_max_inactivity, so the test
# only ever delayed dropping a dead one. A laptop left quiet this long is dropped too, and
# rejoins by itself.
skip_inactivity_poll=1

# For hostapd_cli, which the deploy uses to drop the fixtures it is about to restart, so they
# are let straight back in rather than waiting out the inactivity above.
ctrl_interface=/var/run/hostapd
