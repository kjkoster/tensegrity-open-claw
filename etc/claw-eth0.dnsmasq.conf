# claw-pi's wired segment, 10.0.1.0/24: the addresses its devices are known by, as reservations
# in NetworkManager's own DHCP server. NetworkManager runs a private dnsmasq for every shared
# connection and hands it every file in /etc/NetworkManager/dnsmasq-shared.d/; that is where the
# deploy installs this one. Nothing else runs dnsmasq.
#
# A reservation and not an address set on the device, so a camera that is factory reset, or
# replaced and given this entry's MAC, comes up where the rig looks for it with nothing done to
# it by hand. Reserved addresses sit below the DHCP range, .100–.199, which is left to laptops.
#
#   10.0.1.1   claw-pi itself, from the claw-eth0 profile
#   10.0.1.2   riverrain, the Mac, when it is on the wire: set on the Mac itself
#   10.0.1.3   the camera, reserved below
#
# The retina's build reads the camera's address from the line named `camera`, so this file is
# the one place it is written.

dhcp-host=ac:cc:8e:62:c1:35,camera,10.0.1.3
