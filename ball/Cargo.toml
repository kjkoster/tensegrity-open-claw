[package]
edition      = "2024"
name         = "ball"
rust-version = "1.99"
version      = "0.1.0"

[build-dependencies]
cortex-build = { path = "../cortex-build" }
# The WPA2 key, derived from hostapd.conf's passphrase at build time.
pbkdf2       = "0.13.0"
sha1         = "0.11.0"

[dependencies]
esp-hal            = { version = "~1.2.2", features = ["esp32c3", "unstable"] }
esp-rtos            = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-radio           = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32c3", "unstable", "wifi"] }
esp-alloc           = "0.11.0"
# The chip's facts — its name, its core count — as esp-hal itself knows them, for `ball/sys/`.
esp-metadata-generated = { version = "0.5.3", features = ["esp32c3"] }
# The flash chip's size, for `ball/sys/flash_kb`.
esp-storage         = { version = "0.10.0", features = ["esp32c3"] }

embassy-executor = "0.10.0"
embassy-futures  = "0.1.2"
embassy-sync     = "0.8.0"
embassy-net      = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "multicast",
  "tcp",
  "udp",
] }
embassy-time     = "0.5.0"
# The traits embassy-net's TcpSocket implements its reads and writes through.
embedded-io-async = "0.7.0"

ball-dmx    = { path = "../ball-dmx" }
rig-mqtt    = { path = "../rig-mqtt" }
rtt-target  = "0.6.2"
static_cell = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
