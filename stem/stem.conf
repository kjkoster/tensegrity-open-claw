# Broker configuration for the rig, installed to /etc/mosquitto/conf.d/stem.conf.
#
# The broker belongs to Stem. Stem is the health daemon that stays alive and reporting while
# the brain is down — which is precisely when health matters — and the transport its reports
# travel on is part of that job rather than a service the brain happens to offer. So it lives
# in Stem's directory, beside its daemon, rather than somewhere neutral.
#
# Debian's own mosquitto.conf is left untouched; this is an overlay in the include directory
# it already reads, so a package upgrade cannot quietly revert the rig's settings and this
# file cannot quietly inherit changes to the distribution's defaults.
#
# The version is whatever Debian ships. A broker moving a few hundred bytes a second around
# the rig has no use for anything newer, and a package that upgrades with the OS is one fewer
# thing to maintain on a machine that must come up unattended.
#
# It runs on memory-pi, beside the recordings, so the Pi that drives the show carries none of
# the telemetry.

# One listener on every interface, rather than one bound to memory-pi's address.
#
# Not laziness — a listener bound to a named address fails at startup if that address does not
# exist yet, and memory-pi's WiFi comes up late, long after boot, whenever claw-pi's access
# point does. Binding 10.0.10.2 would make the broker's startup a race it loses on almost every
# boot. The wildcard has no such ordering to lose.
#
# What that exposes is a read-only telemetry tree, on memory-pi's loopback and on claw-pi's
# access point, which is its only network. No topic under it commands anything. memory-pi has
# no public address — it sits behind claw-pi's address translation — so the internet cannot
# reach it, and the Mac reaches it through an SSH forward over claw-pi.
listener 1883 0.0.0.0

# No accounts. Every publisher and subscriber is on memory-pi itself, on the WPA2 access point,
# or an SSH forward away, so a password file here would be a credential to distribute, rotate
# and compile into firmware in exchange for no boundary the network does not already give.
allow_anonymous true

# No persistence, overriding Debian's `persistence true`. Retained topics still make a client
# that joins after the interesting moment see a live picture; what persistence would add is
# that picture surviving a broker restart, and every client already republishes its retained
# topics on each connect, which answers that without the disk.
#
# What the disk would add on top is wrong. A Pi that loses power comes back with whatever
# health was last saved — `connected`, for everything that was up — and a client that died
# while the Pi was down never comes back to correct it. A battery fixture that runs flat can
# never say goodbye at all.
# An absent health topic says "nothing has been heard since the broker started"; a stale one
# says something that is not true. It also keeps the broker's periodic saves off the SD card.
persistence false
