# The rig's Grafana settings, as a drop-in for grafana-server.service. Environment variables
# override grafana.ini setting by setting, so the package's own grafana.ini stays untouched and
# an upgrade never stops to ask about a changed configuration file.
[Service]
# Loopback only: the Mac reaches it through SSH, and nothing else needs it.
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3000
# Nothing leaves the Pi but what the rig asks for: usage reports, update checks and the news
# feed would go out over claw-pi's 4G bundle.
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
# Anyone who reaches it at all has come through SSH with the key, so viewing needs no login.
# Editing still takes the admin login.
Environment=GF_AUTH_ANONYMOUS_ENABLED=true
Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
# The broker comes first on a 1 GB Pi. No memory cap is possible — the Pi's kernel ships with
# the memory cgroup controller off — so Grafana is kept small instead: Go holds on to freed
# memory unless told a limit, and with one it collects sooner. Measured at about 290 MB
# without it. When memory runs out regardless, the kernel kills Grafana before the broker, and
# its CPU comes after the broker's.
Environment=GOMEMLIMIT=200MiB
OOMScoreAdjust=500
Nice=15
