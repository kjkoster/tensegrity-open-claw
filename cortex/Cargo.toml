[package]
edition      = "2024"
name         = "cortex"
rust-version = "1.96"
version      = "0.1.0"

# Everything under the show: audio capture and features, the noise fields, the sACN transports,
# the frame loop.
[dependencies]
alsa = "0.11.0"
arc-swap = "1.7"
signal-hook = "0.3"
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-std"] }
embassy-time     = { version = "0.5.0",  features = ["std"] }
# For whether the kernel holds the clock as synchronised, which std has no call for.
libc = "0.2.189"
rig-mqtt = { path = "../rig-mqtt" }
rusb = "0.9.4"
rustfft = "6.2"
zihatec-rs-485-dmx = "0.1.0"
